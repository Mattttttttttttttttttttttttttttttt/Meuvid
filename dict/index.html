  <script>
    const page = createDictPage({
      hasPos: true,
      dataKey: 'mv_dict',
      dataRaw: DICT,
      kwTable: DICT_KEYWORDS,
      label: 'word',
      noun: 'words',
      hasSections: true,
      sectionsKey: 'mv_sections',
      sectionsRaw: SECTIONS,
    });

    function render() {
      initNav(
        'dict',
        () => AUTH.showLoginModal(render),
        () => { AUTH.logout(); render(); }
      );
      page.render();
    }

    render();
  </script>
